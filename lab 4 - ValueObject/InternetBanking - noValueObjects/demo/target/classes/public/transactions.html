<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Banking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .content-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(250,250,250,0.95) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .tx-item {
            background: linear-gradient(135deg, #f0f4ff 0%, #f9f7ff 100%);
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .tx-item:hover {
            transform: translateX(4px);
            border-left: 4px solid #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        .btn-refresh {
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            transition: all 0.3s ease;
        }
        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(147, 51, 234, 0.3);
        }
    </style>
</head>
<body class="text-gray-900">
    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2 drop-shadow-lg">📊 Transaction History</h1>
            <p class="text-white opacity-90">All your transactions</p>
        </header>

        <div class="content-card p-8 rounded-2xl shadow-2xl">
            <button id="refreshHistory" class="mb-4 btn-refresh text-white font-semibold py-2 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2">
                🔄 Refresh History
            </button>
            <div id="transactionList" class="space-y-3">
                <!-- Transactions will be loaded here -->
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="/index.html" class="inline-block text-white hover:text-blue-200 text-sm font-semibold transition">← Back to Home</a>
        </div>
    </div>

    <button id="wipeDataBtn" class="fixed bottom-4 right-4 bg-red-500 hover:bg-red-600 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow-lg transition" title="Wipe all data">
        🗑️ Wipe Data
    </button>

    <script>
        async function loadTransactionHistory() {
            try {
                const response = await fetch('/transactions');
                const transactions = await response.json();
                const list = document.getElementById('transactionList');
                list.innerHTML = '';
                if (transactions.length === 0) {
                    list.innerHTML = '<p class="text-gray-500">No transactions yet.</p>';
                } else {
                    transactions.forEach(tx => {
                        const div = document.createElement('div');
                        div.className = 'tx-item p-4 rounded-lg';
                        div.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="font-semibold text-gray-800"><strong>${tx.fromAccountId}</strong> → <strong>${tx.toAccountId}</strong></span>
                                <span class="text-xs text-gray-500 bg-white px-2 py-1 rounded">${tx.timestamp}</span>
                            </div>
                            <div class="text-sm text-gray-700 mt-2 font-semibold">💰 ${tx.amount} ${tx.currency}</div>
                        `;
                        list.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading transactions:', error);
                document.getElementById('transactionList').innerHTML = '<p class="text-red-500">Error loading transactions.</p>';
            }
        }

        document.getElementById('refreshHistory').addEventListener('click', loadTransactionHistory);

        document.getElementById('wipeDataBtn').addEventListener('click', async () => {
            if (confirm('Are you sure you want to delete all data? This cannot be undone.')) {
                try {
                    const response = await fetch('/wipe-data', {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        alert('All data has been wiped');
                        location.reload();
                    } else {
                        alert('Error wiping data');
                    }
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        });

        // Load history on page load
        loadTransactionHistory();
    </script>
</body>
</html>
